<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>角色管理</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <style>
        .layui-table-cell {
            height: auto;
            line-height: 28px;
        }
    </style>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-card">
            <div class="layui-card-header">
                <div class="layui-row">
                    <div class="layui-col-md6">
                        <span style="font-weight: bold; font-size: 16px;">角色管理</span>
                    </div>
                    <div class="layui-col-md6" style="text-align: right;">
                        <button class="layui-btn layui-btn-normal" onclick="openAdd()">
                            <i class="layui-icon layui-icon-add-1"></i> 新增角色
                        </button>
                    </div>
                </div>
            </div>
            <div class="layui-card-body">
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">角色名称</label>
                            <div class="layui-input-inline">
                                <input type="text" name="name" placeholder="请输入角色名称" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">状态</label>
                            <div class="layui-input-inline">
                                <select name="status">
                                    <option value="">全部</option>
                                    <option value="1">启用</option>
                                    <option value="0">禁用</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <button type="button" class="layui-btn layui-btn-primary" onclick="search()">
                                <i class="layui-icon layui-icon-search"></i> 搜索
                            </button>
                        </div>
                    </div>
                </form>

                <table id="roleTable" lay-filter="roleTable"></table>
            </div>
        </div>
    </div>

    <script type="text/html" id="statusTpl">
        {{# if(d.status == 1){ }}
            <span class="layui-badge layui-bg-green">启用</span>
        {{# } else { }}
            <span class="layui-badge layui-bg-gray">禁用</span>
        {{# } }}
    </script>

    <script type="text/html" id="barDemo">
        <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
    </script>

    <script src="/static/layui/layui.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        var table, layer, form, $;

        layui.use(['table', 'layer', 'form', 'jquery'], function() {
            table = layui.table;
            layer = layui.layer;
            form = layui.form;
            $ = layui.jquery;

            initTable();
        });

        function initTable() {
            table.render({
                elem: '#roleTable',
                url: '/api/role/list',
                headers: {
                    'Authorization': 'Bearer ' + token
                },
                method: 'GET',
                cols: [[
                    {field: 'id', title: 'ID', width: 80, sort: true},
                    {field: 'name', title: '角色名称', width: 150},
                    {field: 'code', title: '角色编码', width: 150},
                    {field: 'remark', title: '备注', width: 200},
                    {field: 'sort', title: '排序', width: 80, sort: true},
                    {field: 'status', title: '状态', width: 100, templet: '#statusTpl'},
                    {field: 'created_at', title: '创建时间', width: 180, templet: function(d) {
                        return formatDate(d.created_at);
                    }},
                    {title: '操作', width: 150, toolbar: '#barDemo', fixed: 'right'}
                ]],
                page: true,
                limit: 10,
                limits: [10, 20, 30, 50],
                parseData: function(res) {
                    return {
                        "code": res.code,
                        "msg": res.message,
                        "count": res.count,
                        "data": res.data
                    };
                }
            });

            table.on('tool(roleTable)', function(obj) {
                var data = obj.data;
                if (obj.event === 'edit') {
                    openEdit(data.id);
                } else if (obj.event === 'del') {
                    deleteRole(data.id, data.name);
                }
            });
        }

        function search() {
            var name = $('input[name="name"]').val();
            var status = $('select[name="status"]').val();

            table.reload('roleTable', {
                where: {
                    name: name,
                    status: status
                },
                page: {
                    curr: 1
                }
            });
        }

        function openAdd() {
            parent.layer.open({
                type: 2,
                title: '新增角色',
                shadeClose: true,
                shade: 0.8,
                area: ['700px', '600px'],
                content: '/role/form.html?type=add',
                end: function() {
                    table.reload('roleTable');
                }
            });
        }

        function openEdit(id) {
            parent.layer.open({
                type: 2,
                title: '编辑角色',
                shadeClose: true,
                shade: 0.8,
                area: ['700px', '600px'],
                content: '/role/form.html?type=edit&id=' + id,
                end: function() {
                    table.reload('roleTable');
                }
            });
        }

        function deleteRole(id, name) {
            parent.layer.confirm('确定要删除角色 "' + name + '" 吗？', {
                icon: 3,
                title: '提示'
            }, function(index) {
                del('/role/' + id, function(res) {
                    parent.layer.close(index);
                    parent.layer.msg('删除成功', {icon: 1});
                    table.reload('roleTable');
                });
            });
        }
    </script>
</body>
</html>
