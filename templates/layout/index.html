<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>智能停车场管理系统</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f2f2f2;
        }
        .layui-layout-admin .layui-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }
        .layui-layout-admin .layui-logo {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }
        .layui-nav .layui-nav-item a {
            color: #fff !important;
        }
        .layui-nav .layui-nav-item a:hover {
            color: #fff !important;
        }
        .layui-nav-tree .layui-nav-item a {
            color: rgba(255,255,255,0.8) !important;
        }
        .layui-nav-tree .layui-nav-item a:hover {
            color: #fff !important;
        }
        .layui-nav-tree .layui-this > a {
            color: #fff !important;
            background-color: #2a5298 !important;
        }
        .layui-body {
            bottom: 0;
            padding: 15px;
        }
        .layui-tab-title li {
            min-width: 100px;
        }
        .user-info {
            padding: 15px;
            text-align: center;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .user-info .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #fff;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #2a5298;
        }
        .welcome-text {
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body class="layui-layout-body">
    <div class="layui-layout layui-layout-admin">
        <div class="layui-header">
            <div class="layui-logo">
                <i class="layui-icon layui-icon-car"></i> 智能停车场管理系统
            </div>
            <ul class="layui-nav layui-layout-right">
                <li class="layui-nav-item">
                    <a href="javascript:;">
                        <i class="layui-icon layui-icon-username"></i>
                        <span id="nickname">管理员</span>
                    </a>
                    <dl class="layui-nav-child">
                        <dd><a href="javascript:;" onclick="openTab('/user/profile', '个人信息')"><i class="layui-icon layui-icon-form"></i> 个人信息</a></dd>
                        <dd><a href="javascript:;" onclick="openTab('/user/password', '修改密码')"><i class="layui-icon layui-icon-password"></i> 修改密码</a></dd>
                    </dl>
                </li>
                <li class="layui-nav-item">
                    <a href="javascript:;" onclick="logout()">
                        <i class="layui-icon layui-icon-logout"></i> 退出
                    </a>
                </li>
            </ul>
        </div>

        <div class="layui-side layui-bg-black">
            <div class="user-info">
                <div class="avatar">
                    <i class="layui-icon layui-icon-username"></i>
                </div>
                <div id="welcome-nickname" class="welcome-text">欢迎您，管理员</div>
            </div>
            <div class="layui-side-scroll">
                <ul class="layui-nav layui-nav-tree" id="menuTree" lay-filter="menu">
                </ul>
            </div>
        </div>

        <div class="layui-body">
            <div class="layui-tab layui-tab-brief" lay-filter="mainTab" id="mainTab" lay-allowClose="true">
                <ul class="layui-tab-title">
                    <li lay-id="dashboard">
                        <i class="layui-icon layui-icon-home"></i> 控制台
                    </li>
                </ul>
                <div class="layui-tab-content">
                    <div class="layui-tab-item layui-show">
                        <iframe src="/dashboard" frameborder="0" class="iframe-container" style="width:100%;height:100%;border:none;"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/layui/layui.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        var element, layer, $;

        layui.use(['element', 'layer', 'jquery'], function() {
            element = layui.element;
            layer = layui.layer;
            $ = layui.jquery;

            if (!localStorage.getItem('token')) {
                window.location.href = '/login';
                return;
            }

            initPage();
        });

        function initPage() {
            get('/user/info', function(res) {
                $('#nickname').text(res.data.nickname);
                $('#welcome-nickname').text('欢迎您，' + res.data.nickname);
                localStorage.setItem('userInfo', JSON.stringify(res.data));
                buildMenu(res.data.menus);
            }, function() {
                localStorage.removeItem('token');
                window.location.href = '/login';
            });
        }

        function buildMenu(menus) {
            var html = '';
            menus.forEach(function(menu) {
                if (menu.children && menu.children.length > 0) {
                    html += '<li class="layui-nav-item">';
                    html += '<a href="javascript:;">';
                    if (menu.icon) {
                        html += '<i class="layui-icon ' + menu.icon + '"></i> ';
                    }
                    html += menu.name + ' <span class="layui-nav-more"></span></a>';
                    html += '<dl class="layui-nav-child">';
                    menu.children.forEach(function(child) {
                        var url = getMenuUrl(child);
                        html += '<dd>';
                        html += '<a href="javascript:;" data-url="' + url + '" data-title="' + child.name + '">';
                        html += child.name;
                        html += '</a></dd>';
                    });
                    html += '</dl></li>';
                } else if (menu.code === 'dashboard') {
                    html += '<li class="layui-nav-item">';
                    html += '<a href="javascript:;" data-url="/dashboard" data-title="控制台">';
                    if (menu.icon) {
                        html += '<i class="layui-icon ' + menu.icon + '"></i> ';
                    }
                    html += menu.name + '</a></li>';
                }
            });

            $('#menuTree').html(html);
            element.init('nav');

            $('.layui-nav-item a[data-url]').on('click', function() {
                var url = $(this).data('url');
                var title = $(this).data('title');
                if (url) {
                    openTab(url, title);
                }
            });
        }

        function getMenuUrl(menu) {
            var code = menu.code;
            var urlMap = {
                'dashboard': '/dashboard',
                'user': '/user/list',
                'role': '/role/list',
                'menu': '/menu/list',
                'config': '/config/list',
                'log': '/log/list',
                'parking_lot': '/lot/list',
                'parking_space': '/space/list',
                'recognize': '/recognize/index',
                'vehicle': '/vehicle/list',
                'record': '/record/list',
                'finance': '/finance/list',
                'partner': '/partner/list'
            };
            return urlMap[code] || '';
        }

        function openTab(url, title) {
            var layId = url.replace(/\//g, '-');
            
            var tab = $('.layui-tab-title li[lay-id="' + layId + '"]');
            if (tab.length > 0) {
                element.tabChange('mainTab', layId);
                return;
            }

            element.tabAdd('mainTab', {
                title: title,
                content: '<iframe src="' + url + '" frameborder="0" class="iframe-container" style="width:100%;height:100%;border:none;"></iframe>',
                id: layId
            });

            element.tabChange('mainTab', layId);
        }

        function logout() {
            layer.confirm('确定要退出登录吗？', {
                icon: 3,
                title: '提示'
            }, function(index) {
                localStorage.removeItem('token');
                localStorage.removeItem('userInfo');
                layer.close(index);
                window.location.href = '/login';
            });
        }
    </script>
</body>
</html>
