<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>车辆入场</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <style>
        body {
            padding: 20px;
        }
    </style>
</head>
<body>
    <form class="layui-form" lay-filter="entryForm">
        <div class="layui-form-item">
            <label class="layui-form-label">车牌号</label>
            <div class="layui-input-block">
                <input type="text" name="vehicle_no" lay-verify="required" placeholder="请输入车牌号" autocomplete="off" class="layui-input" id="vehicleNo">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">选择停车场</label>
            <div class="layui-input-block">
                <select name="lot_id" lay-verify="required" id="lotSelect" lay-filter="lotSelect">
                    <option value="">请选择停车场</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">选择车位</label>
            <div class="layui-input-block">
                <select name="space_id" lay-verify="required" id="spaceSelect">
                    <option value="">请先选择停车场</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn layui-btn-normal" lay-submit lay-filter="submit">
                    <i class="layui-icon layui-icon-ok"></i> 确认入场
                </button>
            </div>
        </div>
    </form>

    <script src="/static/layui/layui.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        var form, layer, $;
        var plateNo = getQueryParam('plate_no');

        layui.use(['form', 'layer', 'jquery'], function() {
            form = layui.form;
            layer = layui.layer;
            $ = layui.jquery;

            if (plateNo) {
                $('#vehicleNo').val(plateNo);
            }

            loadLots();

            form.on('select(lotSelect)', function(data) {
                loadSpaces(data.value);
            });
        });

        function loadLots() {
            get('/lot/all', function(res) {
                var html = '<option value="">请选择停车场</option>';
                res.data.forEach(function(lot) {
                    html += '<option value="' + lot.id + '">' + lot.name + ' (空余:' + lot.free_spaces + '/' + lot.total_spaces + ')</option>';
                });
                $('#lotSelect').html(html);
                form.render('select');
            });
        }

        function loadSpaces(lotId) {
            if (!lotId) {
                $('#spaceSelect').html('<option value="">请先选择停车场</option>');
                form.render('select');
                return;
            }

            get('/space/list?lot_id=' + lotId + '&status=0&limit=1000', function(res) {
                var html = '<option value="">请选择车位</option>';
                res.data.forEach(function(space) {
                    html += '<option value="' + space.id + '">' + space.space_no + (space.area ? ' [' + space.area + ']' : '') + '</option>';
                });
                $('#spaceSelect').html(html);
                form.render('select');
            });
        }

        form.on('submit(submit)', function(data) {
            var loadIndex = layer.load(1);

            post('/vehicle/entry', data.field, function(res) {
                layer.close(loadIndex);
                layer.msg('入场成功', {icon: 1}, function() {
                    parent.layer.close(parent.layer.getFrameIndex(window.name));
                    parent.layui.table.reload('recordTable');
                });
            }, function() {
                layer.close(loadIndex);
            });

            return false;
        });

        function getQueryParam(name) {
            var url = window.location.search.substring(1);
            var params = url.split('&');
            for (var i = 0; i < params.length; i++) {
                var param = params[i].split('=');
                if (param[0] === name) {
                    return param[1];
                }
            }
            return null;
        }
    </script>
</body>
</html>
