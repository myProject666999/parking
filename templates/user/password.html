<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>修改密码</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <style>
        body {
            padding: 30px;
        }
        .password-box {
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            background: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .password-title {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="password-box">
        <h3 class="password-title">修改密码</h3>
        <form class="layui-form" lay-filter="passwordForm">
            <div class="layui-form-item">
                <label class="layui-form-label">原密码</label>
                <div class="layui-input-block">
                    <input type="password" name="old_password" lay-verify="required" placeholder="请输入原密码" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">新密码</label>
                <div class="layui-input-block">
                    <input type="password" name="new_password" lay-verify="required|pass" placeholder="请输入新密码" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">确认密码</label>
                <div class="layui-input-block">
                    <input type="password" name="confirm_password" lay-verify="required|confirmPass" placeholder="请确认新密码" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn layui-btn-normal" lay-submit lay-filter="submit">
                        <i class="layui-icon layui-icon-password"></i> 确认修改
                    </button>
                    <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                </div>
            </div>
        </form>
    </div>

    <script src="/static/layui/layui.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        layui.use(['form', 'layer'], function() {
            var form = layui.form;
            var layer = layui.layer;

            form.verify({
                pass: function(value) {
                    if (value.length < 6) {
                        return '密码长度不能少于6位';
                    }
                },
                confirmPass: function(value) {
                    var newPass = $('input[name="new_password"]').val();
                    if (value !== newPass) {
                        return '两次密码输入不一致';
                    }
                }
            });

            form.on('submit(submit)', function(data) {
                var loadIndex = layer.load(1);

                post('/user/password', data.field, function(res) {
                    layer.close(loadIndex);
                    layer.msg('密码修改成功', {icon: 1}, function() {
                        parent.layer.closeAll();
                        parent.location.href = '/login';
                    });
                }, function() {
                    layer.close(loadIndex);
                });

                return false;
            });
        });
    </script>
</body>
</html>
