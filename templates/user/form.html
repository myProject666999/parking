<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>用户表单</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <style>
        body {
            padding: 20px;
        }
    </style>
</head>
<body>
    <form class="layui-form" id="userForm" lay-filter="userForm">
        <div class="layui-form-item">
            <label class="layui-form-label">用户名</label>
            <div class="layui-input-block">
                <input type="text" name="username" lay-verify="required" placeholder="请输入用户名" autocomplete="off" class="layui-input" id="username">
            </div>
        </div>
        <div class="layui-form-item" id="passwordField">
            <label class="layui-form-label">密码</label>
            <div class="layui-input-block">
                <input type="password" name="password" placeholder="请输入密码" autocomplete="off" class="layui-input" id="password">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">昵称</label>
            <div class="layui-input-block">
                <input type="text" name="nickname" placeholder="请输入昵称" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">手机号</label>
            <div class="layui-input-block">
                <input type="text" name="phone" placeholder="请输入手机号" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">邮箱</label>
            <div class="layui-input-block">
                <input type="text" name="email" placeholder="请输入邮箱" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">角色</label>
            <div class="layui-input-block">
                <select name="role_id" lay-verify="required" id="roleSelect">
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-block">
            <input type="radio" name="status" value="1" title="启用" checked>
            <input type="radio" name="status" value="0" title="禁用">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn" lay-submit lay-filter="submit">立即提交</button>
                <button type="reset" class="layui-btn layui-btn-primary">重置</button>
            </div>
        </div>
    </form>

    <script src="/static/layui/layui.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        var form, layer, $;
        var type = getQueryParam('type');
        var id = getQueryParam('id');

        layui.use(['form', 'layer', 'jquery'], function() {
            form = layui.form;
            layer = layui.layer;
            $ = layui.jquery;

            loadRoles();

            if (type === 'edit' && id) {
                $('#passwordField').find('.layui-form-label').html('新密码');
                $('#password').attr('placeholder', '不修改请留空');
                loadUserData();
            }
        });

        function loadRoles() {
            get('/role/all', function(res) {
                var html = '<option value="">请选择角色</option>';
                res.data.forEach(function(role) {
                    html += '<option value="' + role.id + '">' + role.name + '</option>';
                });
                $('#roleSelect').html(html);
                form.render('select');

                if (type === 'edit' && id) {
                    loadUserData();
                }
            });
        }

        function loadUserData() {
            get('/user/' + id, function(res) {
                var data = res.data;
                form.val('userForm', {
                    username: data.username,
                    nickname: data.nickname,
                    phone: data.phone,
                    email: data.email,
                    role_id: data.role_id,
                    status: data.status
                });
                $('#username').attr('disabled', true);
                form.render();
            });
        }

        form.on('submit(submit)', function(data) {
            var loadIndex = layer.load(1);

            if (type === 'add') {
                if (!data.field.password) {
                    layer.close(loadIndex);
                    layer.msg('请输入密码', {icon: 2});
                    return false;
                }
                post('/user', data.field, function(res) {
                    layer.close(loadIndex);
                    layer.msg('创建成功', {icon: 1}, function() {
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                    });
                }, function() {
                    layer.close(loadIndex);
                });
            } else {
                if (!data.field.password) {
                    delete data.field.password;
                }
                put('/user/' + id, data.field, function(res) {
                    layer.close(loadIndex);
                    layer.msg('更新成功', {icon: 1}, function() {
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                    });
                }, function() {
                    layer.close(loadIndex);
                });
            }

            return false;
        });

        function getQueryParam(name) {
            var url = window.location.search.substring(1);
            var params = url.split('&');
            for (var i = 0; i < params.length; i++) {
                var param = params[i].split('=');
                if (param[0] === name) {
                    return param[1];
                }
            }
            return null;
        }
    </script>
</body>
</html>
