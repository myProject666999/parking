<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>用户管理</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <style>
        .layui-table-cell {
            height: auto;
            line-height: 28px;
        }
    </style>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-card">
            <div class="layui-card-header">
                <div class="layui-row">
                    <div class="layui-col-md6">
                        <span style="font-weight: bold; font-size: 16px;">用户管理</span>
                    </div>
                    <div class="layui-col-md6" style="text-align: right;">
                        <button class="layui-btn layui-btn-normal" onclick="openAdd()">
                            <i class="layui-icon layui-icon-add-1"></i> 新增用户
                        </button>
                        <button class="layui-btn layui-btn-primary" onclick="search()">
                            <i class="layui-icon layui-icon-search"></i> 搜索
                        </button>
                    </div>
                </div>
            </div>
            <div class="layui-card-body">
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">用户名</label>
                            <div class="layui-input-inline">
                                <input type="text" name="username" placeholder="请输入用户名" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">状态</label>
                            <div class="layui-input-inline">
                                <select name="status">
                                    <option value="">全部</option>
                                    <option value="1">启用</option>
                                    <option value="0">禁用</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </form>

                <table id="userTable" lay-filter="userTable"></table>
            </div>
        </div>
    </div>

    <script type="text/html" id="toolbarDemo">
        <button class="layui-btn layui-btn-sm" lay-event="add">
            <i class="layui-icon layui-icon-add-1"></i> 新增
        </button>
    </script>

    <script type="text/html" id="statusTpl">
        {{# if(d.status == 1){ }}
            <span class="layui-badge layui-bg-green">启用</span>
        {{# } else { }}
            <span class="layui-badge layui-bg-gray">禁用</span>
        {{# } }}
    </script>

    <script type="text/html" id="barDemo">
        <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
    </script>

    <script src="/static/layui/layui.js"></script>
    <script src="/static/js/common.js"></script>
    <script>
        var table, layer, form, $;

        layui.use(['table', 'layer', 'form', 'jquery'], function() {
            table = layui.table;
            layer = layui.layer;
            form = layui.form;
            $ = layui.jquery;

            initTable();

            form.on('submit()', function(data) {
                search();
                return false;
            });
        });

        function initTable() {
            table.render({
                elem: '#userTable',
                url: '/api/user/list',
                headers: {
                    'Authorization': 'Bearer ' + token
                },
                method: 'GET',
                cols: [[
                    {field: 'id', title: 'ID', width: 80, sort: true},
                    {field: 'username', title: '用户名', width: 120},
                    {field: 'nickname', title: '昵称', width: 120},
                    {field: 'phone', title: '手机号', width: 130},
                    {field: 'email', title: '邮箱', width: 180},
                    {field: 'status', title: '状态', width: 100, templet: '#statusTpl'},
                    {field: 'created_at', title: '创建时间', width: 180, templet: function(d) {
                        return formatDate(d.created_at);
                    }},
                    {title: '操作', width: 150, toolbar: '#barDemo', fixed: 'right'}
                ]],
                page: true,
                limit: 10,
                limits: [10, 20, 30, 50],
                parseData: function(res) {
                    return {
                        "code": res.code,
                        "msg": res.message,
                        "count": res.count,
                        "data": res.data
                    };
                },
                request: {
                    pageName: 'page',
                    limitName: 'limit'
                }
            });

            table.on('tool(userTable)', function(obj) {
                var data = obj.data;
                if (obj.event === 'edit') {
                    openEdit(data.id);
                } else if (obj.event === 'del') {
                    deleteUser(data.id, data.username);
                }
            });
        }

        function search() {
            var username = $('input[name="username"]').val();
            var status = $('select[name="status"]').val();

            table.reload('userTable', {
                where: {
                    username: username,
                    status: status
                },
                page: {
                    curr: 1
                }
            });
        }

        function openAdd() {
            parent.layer.open({
                type: 2,
                title: '新增用户',
                shadeClose: true,
                shade: 0.8,
                area: ['600px', '500px'],
                content: '/user/form.html?type=add',
                end: function() {
                    table.reload('userTable');
                }
            });
        }

        function openEdit(id) {
            parent.layer.open({
                type: 2,
                title: '编辑用户',
                shadeClose: true,
                shade: 0.8,
                area: ['600px', '500px'],
                content: '/user/form.html?type=edit&id=' + id,
                end: function() {
                    table.reload('userTable');
                }
            });
        }

        function deleteUser(id, username) {
            parent.layer.confirm('确定要删除用户 "' + username + '" 吗？', {
                icon: 3,
                title: '提示'
            }, function(index) {
                del('/user/' + id, function(res) {
                    parent.layer.close(index);
                    parent.layer.msg('删除成功', {icon: 1});
                    table.reload('userTable');
                });
            });
        }
    </script>
</body>
</html>
